<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join — LiveQ</title><link rel="stylesheet" href="style.css"></head><body class="join"><main class="joinCard"><div class="brand">LIVE<span>Q</span></div><div id="loading">Memuat pertanyaan…</div><section id="form" hidden><div class="question small" id="question"></div><label>Nama (opsional)</label><input id="name" placeholder="Nama kamu"><label>Jawaban</label><textarea id="answer" maxlength="80" placeholder="Tulis jawabanmu…"></textarea><button id="send">Kirim jawaban →</button><p id="status"></p></section></main><script src="/socket.io/socket.io.js"></script><script>
const socket=io(),room=new URLSearchParams(location.search).get('room');const $=id=>document.getElementById(id);socket.emit('audience:join',{room,name:localStorage.lqName||'Anonim'});socket.on('room:state',d=>{$('loading').hidden=true;$('form').hidden=false;$('question').textContent=d.question;$('send').disabled=!d.active;$('send').textContent=d.active?'Kirim jawaban →':'Jawaban sedang ditutup';});$('send').onclick=()=>{const name=$('name').value.trim()||'Anonim';localStorage.lqName=name;socket.emit('audience:answer',{text:$('answer').value,name});};socket.on('answer:ok',()=>{$('answer').value='';$('status').textContent='✓ Jawaban terkirim!';$('send').disabled=true;});socket.on('answer:error',m=>{$('status').textContent=m});socket.on('error:room',m=>{$('loading').textContent=m});
</script></body></html>

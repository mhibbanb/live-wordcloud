<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Question</title><link rel="stylesheet" href="style.css"></head><body class="dark"><main class="landing"><div class="brand">LIVE<span>Q</span></div><h1>Tanya audiens.<br><em>Lihat jawabannya live.</em></h1><p>Buat satu pertanyaan, bagikan kode atau QR, lalu semua jawaban muncul real-time di layar.</p><div class="card create"><label>Pertanyaan pertama</label><input id="q" value="Apa yang paling ingin kalian ubah tahun ini?"><button id="create">Buat Live Room →</button></div><div class="how"><span>01 Buat room</span><span>02 Bagikan QR</span><span>03 Jawaban muncul</span></div></main><script>document.getElementById('create').onclick=async()=>{const question=document.getElementById('q').value;const r=await fetch('/api/rooms',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question})}).then(x=>x.json());location.href='/presenter.html?room='+r.room};</script></body></html>

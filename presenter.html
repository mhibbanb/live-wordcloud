<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presenter — LiveQ</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><div class="brand">LIVE<span>Q</span></div><div class="roomBadge">ROOM <b id="room"></b></div><button id="full" class="ghost">⛶ Fullscreen</button></header><main class="presenter"><section class="stage"><div class="question" id="question"></div><div class="cloud" id="cloud"></div><div class="empty" id="empty">Jawaban audiens akan muncul di sini…</div><div class="livebar"><span class="dot"></span><b id="count">0</b> jawaban <span>•</span> <b id="people">0</b> audiens online</div></section><aside class="panel"><h3>Kontrol</h3><label>Pertanyaan</label><textarea id="newQ"></textarea><button id="apply">Ganti pertanyaan & reset</button><div class="qrbox"><img id="qr"><small>Scan QR untuk menjawab</small><strong id="joinUrl"></strong></div><div class="actions"><button id="toggle">⏸ Tutup jawaban</button><button id="clear" class="danger">Hapus jawaban</button></div></aside></main><script src="/socket.io/socket.io.js"></script><script>
const socket=io(), room=new URLSearchParams(location.search).get('room'); const $=id=>document.getElementById(id); $('room').textContent=room;
let answers=[];
async function load(){const r=await fetch('/api/rooms/'+room);if(!r.ok)return alert('Room tidak ditemukan');const d=await r.json();renderState(d);$('qr').src=d.qr;$('joinUrl').textContent=d.joinUrl}
function renderState(d){$('question').textContent=d.question;$('newQ').value=d.question;$('toggle').textContent=d.active?'⏸ Tutup jawaban':'▶ Buka jawaban';renderAnswers(d.answers||[])}
function renderAnswers(a){answers=a; $('count').textContent=a.length; $('empty').style.display=a.length?'none':'block'; const c=$('cloud');c.innerHTML='';const freq={};a.forEach(x=>{const k=x.text.toLowerCase();freq[k]=(freq[k]||0)+1});const max=Math.max(1,...Object.values(freq));[...a].sort(()=>Math.random()-.5).forEach((x,i)=>{const el=document.createElement('span');el.textContent=x.text;el.className='word';const n=freq[x.text.toLowerCase()];el.style.fontSize=(18+(n/max)*42)+'px';el.style.setProperty('--r',(Math.random()*10-5)+'deg');el.style.animationDelay=(i*.03)+'s';c.appendChild(el)});}
socket.emit('presenter:join',{room});socket.on('room:state',renderState);socket.on('answers:update',d=>renderAnswers(d.answers));socket.on('audience:count',n=>$('people').textContent=n);socket.on('error:room',m=>alert(m));
$('apply').onclick=()=>socket.emit('presenter:setQuestion',{question:$('newQ').value});$('toggle').onclick=()=>socket.emit('presenter:toggle',{active:$('toggle').textContent.includes('Tutup')?false:true});$('clear').onclick=()=>socket.emit('presenter:clear');$('full').onclick=()=>document.documentElement.requestFullscreen?.();
load();
</script></body></html>
